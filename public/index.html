<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daniel Emmanuel • Creative Professional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    
    body { font-family: 'Inter', system-ui, sans-serif; }
    
    .hero-bg {
      background: linear-gradient(-45deg, #7e22ce, #db2777, #f97316, #eab308, #22d3ee, #6366f1, #ec4899);
      background-size: 700% 700%;
      animation: vibrantGradient 10s ease infinite;
    }
    
    @keyframes vibrantGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.18); }
    .light .glass { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.15); }
    
    .project-card {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .project-card:hover {
      transform: translateY(-20px) scale(1.04);
      box-shadow: 0 40px 80px -20px rgb(236 72 153 / 0.5);
    }
    
    .gradient-text {
      background: linear-gradient(to right, #f472b6, #c026d3, #22d3ee, #eab308);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 5s linear infinite;
    }
    
    @keyframes textShimmer { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
    
    .tab-active { border-bottom: 5px solid #ec4899; color: #fff; font-weight: 600; }
    
    .dark { --tw-bg-opacity: 1; }
    
    /* Responsive navigation mode buttons */
    @media (max-width: 768px) {
      .mode-switcher {
        flex-direction: column;
        gap: 2px;
        padding: 2px;
        border-radius: 12px;
      }
      
      .mode-switcher button {
        padding: 8px 12px;
        font-size: 10px;
        border-radius: 8px;
      }
    }
    
    @media (max-width: 640px) {
      .nav-items {
        gap: 12px !important;
        font-size: 11px !important;
      }
      
      .mode-switcher {
        transform: scale(0.85);
      }
    }
    
    @media (max-width: 480px) {
      .nav-items {
        flex-direction: column;
        gap: 8px !important;
        position: absolute;
        top: 80px;
        right: 20px;
        background: rgba(0,0,0,0.9);
        padding: 12px;
        border-radius: 12px;
        backdrop-filter: blur(16px);
      }
      
      .mode-switcher {
        transform: scale(0.75);
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
